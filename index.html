<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a110d">
<title>АРХИУМ v6.51 — Полевой атлас Зоны</title>
<style>html,body{margin:0;min-height:100%;background:#09100d;color:#d9d6bc;font:16px system-ui,sans-serif}main{min-height:100vh;display:flex;justify-content:center;align-items:center;flex-flow:column;gap:20px;text-align:center;padding:24px;box-sizing:border-box}.logo{font-size:34px;color:#e0b75b;font-weight:800;letter-spacing:.15em}.s{color:#89a58a;font-size:14px}#error{color:#ff8b6f;max-width:550px}</style>
</head><body><main><div class="logo">АРХИУМ</div><div>Подготовка полевого атласа Зоны…</div><div id="status" class="s" aria-live="polite">Подключаемся к архиву</div><div id="error" role="alert"></div></main>
<script>
(async function(){
  try{
    const reply=await fetch('./release-parts/manifest.json',{cache:'no-cache'});
    if(!reply.ok)throw Error('Не найден манифест релиза (HTTP '+reply.status+')');
    const manifest=await reply.json();
    if(manifest.version!=='6.51'||!Number.isInteger(manifest.count)||manifest.count<1||manifest.count>200)throw Error('Неверный манифест');
    const chunks=new Array(manifest.count);
    let cursor=0,completed=0;
    const workers=Array.from({length:Math.min(6,manifest.count)},async()=>{
      while(true){
        const i=cursor++;
        if(i>=manifest.count)break;
        const filename='./release-parts/part'+String(i).padStart(3,'0')+'.txt';
        const response=await fetch(filename);
        if(!response.ok)throw Error('Отсутствует файл '+filename+' (HTTP '+response.status+')');
        chunks[i]=await response.text();
        completed++;
        document.getElementById('status').textContent='Загрузка энциклопедии: '+Math.round(completed*100/manifest.count)+'%';
      }
    });
    await Promise.all(workers);
    let html=chunks.join('');
    // ARCHIUM photo atlas: staged in this branch; the published beta is unchanged.
    const atlasLink='<a href="./locations.html" class="archium-photo-atlas-link" aria-label="Открыть фотоатлас 26 локаций">⌖ ФОТОАТЛАС · 26 ЛОКАЦИЙ ↗</a>';
    const atlasCSS='<style>.archium-photo-atlas-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin:8px 0 5px;padding:8px 15px;border:1px solid #b69b58;border-radius:8px;background:linear-gradient(120deg,#1d3022,#101e18);color:#f5d58e;font:700 12px system-ui,sans-serif;letter-spacing:.08em;text-decoration:none;text-align:center;box-shadow:inset 0 1px 0 #ffffff16}.archium-photo-atlas-link:hover,.archium-photo-atlas-link:focus-visible{background:#2b4430;border-color:#ecd181}.pda-landing-content>.archium-photo-atlas-link{max-width:100%}.pda-catalog-tools>.archium-photo-atlas-link{width:auto;margin:0;min-height:44px}@media(max-width:520px){.pda-catalog-tools>.archium-photo-atlas-link{width:100%;margin-top:5px}}</style>';
    html=html.replace('</head>',atlasCSS+'</head>');
    html=html.replace(/(<button id="pda-open-catalog"[\s\S]*?<\/button>)/i,'$1'+atlasLink);
    html=html.replace(/(<button type="button" id="pda-archive"[\s\S]*?<\/button>)/i,'$1'+atlasLink);

    if(!/^<!doctype html>/i.test(html)||!/<\/html>\s*$/.test(html))throw Error('Сборка неполная');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('status').textContent='Ошибка загрузки';
    document.getElementById('error').textContent=e&&e.message?e.message:String(e);
  }
})();
</script></body></html>
